block: adc_cdac
title: Split-capacitor redundant CDAC, one side (instantiated twice)
version: 0.1.0
owner: TBD
status: behavioral
views:
  behav: design/behav/adc_cdac.scs
  xtor: design/xtor/adc_cdac/adc_cdac.scs
summary: >
  13 weights w_j (j = 12..0) = 1024 512 256 192 128 64 32 32 16 8 4 2 1 x cu,
  cu = 0.5 fF. Each weight is two equal halves: H (neutral state VREFP) and
  L (neutral state VREFN). Bottom-plate sampling: while CONV = 0 the bottom
  plates of the sampled weights (all but j = 9 and j = 5) track VIN through
  NMOS switches whose gate is VG (bootstrapped, from adc_bootstrap) and the
  top plate is held at VCM by a switch on PHI_S/PHI_SB. Non-sampled weights
  stay in the neutral state. With CONV = 1 every half is driven by an inverter
  between VREFP and VREFN: H to VREFP unless DH<j>, L to VREFN unless RL<j>.
  The top-level connects DH = DN, RL = UP on the VINP side and DH = UP, RL = DN
  on the VINN side, so each decision moves the two top plates in opposite
  directions and the common mode stays constant.
ports:
  - {name: VIN,   dir: in,  type: analog, side: left,   desc: "input (after the 50 ohm source)"}
  - {name: VG,    dir: in,  type: analog, side: left,   desc: "bootstrapped gate of the input switches (VIN + ~AVDD while tracking, 0 while converting)"}
  - {name: TOP,   dir: out, type: analog, side: right,  desc: "top plate, to the comparator"}
  - {name: VCM,   dir: in,  type: analog, side: top,    desc: "0.45 V top-plate reset level"}
  - {name: VREFP, dir: in,  type: analog, side: top,    desc: "0.9 V reference"}
  - {name: VREFN, dir: in,  type: analog, side: bottom, desc: "reference ground"}
  - {name: PHI_S, dir: in,  type: clock,  side: left,   desc: "top-plate switch, high = track (opens first: sampling instant)"}
  - {name: PHI_SB, dir: in, type: clock,  side: left,   desc: "complement of PHI_S"}
  - {name: CONV,  dir: in,  type: clock,  side: left,   desc: "high = drivers enabled (convert); low = sampled halves tri-stated"}
  - {name: DH12, dir: in, type: digital, side: bottom, bus: DH, desc: "drop H half of weight j=12 to VREFN"}
  - {name: DH11, dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH10, dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH9,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH8,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH7,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH6,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH5,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH4,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH3,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH2,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH1,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: DH0,  dir: in, type: digital, side: bottom, bus: DH}
  - {name: RL12, dir: in, type: digital, side: bottom, bus: RL, desc: "raise L half of weight j=12 to VREFP"}
  - {name: RL11, dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL10, dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL9,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL8,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL7,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL6,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL5,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL4,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL3,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL2,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL1,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: RL0,  dir: in, type: digital, side: bottom, bus: RL}
  - {name: DVDD, dir: supply, type: supply, side: top,    desc: "0.9 V supply of the driver pre-logic"}
  - {name: VSS,  dir: ground, type: supply, side: bottom, desc: "ground"}
operating:
  vin_range: [0.0, 0.9]
  top_load: 15.0e-15          # F, comparator input
  vg_from_ideal_bootstrap: "VIN + AVDD while CONV = 0"
specs:
  - {id: DAC-01, name: "sampling capacitance C_S (per side)",           metric: cs_pF,         unit: pF, min: 0.99, max: 1.06, corners: typ, test: tb_cdac_weights}
  - {id: DAC-02, name: "full scale VREF*(sum w + 1/2)*cu/C_S (diff peak)", metric: fs_peak_V,  unit: V,  min: 0.97, corners: all, test: tb_cdac_weights}
  - {id: DAC-03, name: "max relative weight error (systematic)",         metric: weight_err_max_pct, unit: '%', max: 0.5, corners: typ, test: tb_cdac_weights}
  - {id: DAC-04, name: "top-plate gain C_S/C_tot",                      metric: top_gain,      unit: '',  min: 0.78, corners: typ, test: tb_cdac_weights}
  - {id: DAC-05, name: "DAC step settling, w=32 step to 0.25 LSB",     metric: t_settle32_ps, unit: ps, max: 75, corners: all, test: tb_cdac_settle}
  - {id: DAC-06, name: "DAC step settling, w=1024 step to 5 %",        metric: t_settle1024_ps, unit: ps, max: 40, corners: all, test: tb_cdac_settle}
  - {id: DAC-07, name: "settling time constant (top plate)",            metric: tau_ps,        unit: ps, max: 15, corners: all, test: tb_cdac_settle}
  - {id: DAC-08, name: "conversion start CONV rise -> TOP within 1 %", metric: t_start_settle_ps, unit: ps, max: 100, corners: all, test: tb_cdac_settle}
  - {id: DAC-09, name: "tracking SFDR (ideal VG, 50 ohm, 49.9 MHz, -1 dBFS, diff)", metric: sfdr_dBc, unit: dBc, min: 85, corners: all, test: tb_cdac_track}
  - {id: DAC-10, name: "tracking SNDR excl. kT/C (same)",               metric: sndr_dB,       unit: dB, min: 80, corners: all, test: tb_cdac_track}
  - {id: DAC-11, name: "top-plate droop over 5 ns hold",                metric: droop_lsb,     unit: LSB, max: 0.1, corners: all, test: tb_cdac_settle}
  - {id: DAC-12, name: "VREFP charge per conversion (per side)",        metric: qref_pC,       unit: pC, max: 0.6, corners: typ, test: tb_cdac_settle}
  - {id: DAC-13, name: "control input capacitance (DH/RL)",             metric: cin_ctrl_fF,   unit: fF, max: 6, corners: typ, test: tb_cdac_settle}
tests:
  tb_cdac_weights:
    netlist: tb/cdac/tb_cdac_weights.scs
    measure: adcflow.measure.cdac:weights
    desc: >
      One CDAC with ideal VG and ideal controls. Two sampling cycles with
      VIN = 0.45 -/+ 0.2 V give the input-to-top gain; then the 26 control
      lines are toggled one at a time (neutral -> active -> neutral) and every
      top-plate step is converted into an input-referred weight in LSB.
  tb_cdac_settle:
    netlist: tb/cdac/tb_cdac_settle.scs
    measure: adcflow.measure.cdac:settle
    desc: >
      Steps of RL12 (w=1024), RL5 (w=32) and RL0 (w=1) driven by 10 ps edges;
      top-plate settling time, single-pole fit, conversion-start settling,
      5 ns hold droop and VREFP charge per conversion.
  tb_cdac_track:
    netlist: tb/cdac/tb_cdac_track.scs
    measure: adcflow.measure.cdac:track
    prepare: adcflow.measure.top:prepare
    params: {fin_target: 49.9e6, npts: 256}
    desc: >
      Two CDACs (P and N) with ideal bootstrapped gates, sine from 50 ohm per
      side at 49.9 MHz, -1 dBFS, 100 MS/s ideal phases, no decisions. The
      differential top-plate voltage 100 ps after CONV rises is stored per
      sample; FFT gives SFDR / SNDR of the sampling network.
